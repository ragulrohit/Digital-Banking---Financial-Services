<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | STACKLY</title>
  <meta name="description" content="Your Stackly digital banking dashboard.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="overview" data-forward="1">
  <div id="dashShell"></div>

  <!-- dashboard.html forwards verified users to the full overview page -->
  <div style="display:flex;align-items:center;justify-content:center;min-height:60vh">
    <div class="auth-succ">
      <div class="auth-succ-icon"><i class="fa-solid fa-arrow-right-to-bracket"></i></div>
      <h2>Loading your dashboard...</h2>
      <p>Please wait while we fetch your overview.</p>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script>
    /* only logged-in users may view the dashboard */
    document.addEventListener("DOMContentLoaded", function () {
      if (typeof authAPI !== "undefined" && authAPI.checkLogin()) {
        window.location.replace("overview.html");
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
