<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | STACKLY</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="404">
  <main class="not-found-page">
    <a class="not-found-logo" href="index.html" aria-label="Stackly home"><img class="brand-logo" src="stackly/assets/icons/images/Stackly_logo.png" alt="Stackly logo"></a>
    <div class="not-found-art">404</div>
    <h1>Oops! Page not found</h1>
    <p>The page you are looking for may have moved or does not exist.</p>
    <div class="not-found-actions">
      <button class="btn btn-primary btn-lg" type="button" onclick="if (history.length > 1) history.back(); else window.location.href='index.html';"><i class="fa-solid fa-arrow-left"></i> Go Back</button>
      <a class="btn btn-ghost btn-lg" href="index.html"><i class="fa-solid fa-house"></i> Back to Home</a>
    </div>
  </main>
  <script src="js/main.js"></script>
</body>
</html>
